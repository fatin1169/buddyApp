<script>
document.addEventListener("DOMContentLoaded", function() {
    // Get the full lowercase URL string
    const currentUrl = window.location.href.toLowerCase();
    
    const dashboardLink = document.getElementById("nav-dashboard");
    const managerLink = document.getElementById("nav-manager");

    // Clean out all active flags first
    dashboardLink.classList.remove("active");
    managerLink.classList.remove("active");

    // Use flexible string inclusion matching instead of strict equality
    if (currentUrl.includes("admin_dashboard")) {
        dashboardLink.classList.add("active");
    } else if (currentUrl.includes("user_info")) {
        managerLink.classList.add("active");
    }
});

function confirmSignOut(event) {
    var verify = confirm("Are you sure you want to sign out of your profile session?");
    if (!verify) {
        event.preventDefault();
        return false;
    }
    return true;
}
</script>
