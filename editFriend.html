<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Friend Info</title>
    <style>
        /* Blue Theme - Same style as Friend Info */
        :root {
            --bg-color: #f0f7ff;
            --card-bg: #ffffff;
            --border-color: #93c5fd;
            --text-main: #1e3a5f;
            --text-muted: #64748b;
            --btn-blue: #2563eb;
            --btn-blue-hover: #1d4ed8;
            --btn-blue-shadow: #1a3a8a;
            --accent-blue: #3b82f6;
            --accent-blue-shadow: #1a3a8a;
            --accent-sand: #dbeafe;
            --accent-sand-shadow: #93c5fd;
            --accent-red: #f87171;
            
            --ac-green: #2563eb;
            --ac-green-shadow: #1a3a8a;
            --ac-orange: #3b82f6;
            --ac-orange-shadow: #1a3a8a;
            --ac-yellow: #93c5fd;
            --ac-yellow-shadow: #60a5fa;
            --ac-sand: #dbeafe;
            --ac-sand-shadow: #93c5fd;
            --ac-red: #f87171;
        }

        /* Video Background - FULL SCREEN NO FILTER */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            z-index: -1;
        }

        /* Fallback background color if video doesn't load */
        body {
            background-color: #1a2a3a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 70px 10px 30px 10px; /* Reduced top padding */
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 600px; 
            margin-top: 0; /* Removed extra margin */
        }

        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; /* Reduced margin */
            padding: 0 5px; 
        }

        .title {
            font-size: 20px; /* Slightly smaller */
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Form Card - FIXED border-radius */
        .form-card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            box-shadow: 0 6px 0px var(--border-color);
            margin-bottom: 20px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0px var(--border-color);
        }

        /* Use flexbox instead of table for proper border-radius */
        .form-inner {
            display: flex;
            flex-wrap: wrap;
        }

        .left-panel {
            width: 35%;
            border-right: 3px dashed var(--border-color);
            text-align: center;
            vertical-align: middle;
            padding: 25px 15px; /* Reduced padding */
            background-color: #f8faff;
            min-height: 350px; /* Reduced min-height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .photo-upload-wrapper {
            position: relative;
            display: inline-block;
            width: 90px; /* Slightly smaller */
            height: 90px;
            margin-bottom: 10px; /* Reduced margin */
            cursor: pointer;
        }

        .circle-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #ffffff; 
            display: flex;
            align-items: flex-end; 
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden; 
            border: 3px solid var(--border-color);
            transition: border-color 0.3s ease;
        }

        .circle-photo:hover {
            border-color: var(--btn-blue);
        }

        .avatar-placeholder {
            width: 75%;
            height: 75%;
            fill: var(--border-color);
        }

        .camera-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: var(--btn-blue);
            color: #ffffff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff; 
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
            font-size: 11px;
        }

        .hidden-file-input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        .underline-name {
            display: inline-block;
            font-weight: 800;
            color: var(--text-main);
            font-size: 14px;
            border-bottom: 2px dashed var(--btn-blue);
            padding-bottom: 2px;
            min-width: 50px;
            text-transform: uppercase;
        }

        .right-panel {
            width: 65%;
            padding: 20px 18px; /* Reduced padding */
            vertical-align: top;
            flex: 1;
        }

        .input-group {
            margin-bottom: 8px; /* Reduced margin */
        }

        .input-group label {
            display: block;
            font-size: 10px; /* Smaller label */
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 8px 12px; /* Smaller padding */
            border: 2px solid var(--border-color);
            border-radius: 10px; /* Slightly smaller */
            font-size: 13px;
            color: var(--text-main);
            background-color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--btn-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .actions-row {
            text-align: right;
            margin-top: 12px; /* Reduced margin */
        }

        .btn {
            font-size: 12px; /* Smaller */
            font-weight: bold;
            padding: 7px 18px; /* Smaller padding */
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-left: 6px;
            display: inline-block;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-save {
            background-color: var(--btn-blue);
            color: #ffffff;
            box-shadow: 0 4px 0px var(--btn-blue-shadow);
        }
        .btn-save:hover {
            background-color: var(--btn-blue-hover);
        }
        .btn-save:active { transform: translateY(3px); box-shadow: 0 1px 0px var(--btn-blue-shadow); }

        .btn-cancel {
            background-color: var(--ac-sand);
            color: var(--text-main);
            box-shadow: 0 4px 0px var(--ac-sand-shadow);
        }
        .btn-cancel:active { transform: translateY(3px); box-shadow: 0 1px 0px var(--ac-sand-shadow); }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 60px 10px 20px 10px;
            }

            .form-inner {
                flex-direction: column;
            }
            
            .left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 3px dashed var(--border-color);
                padding: 20px;
                min-height: auto;
            }
            
            .right-panel {
                width: 100%;
                padding: 15px 14px;
            }

            .photo-upload-wrapper {
                width: 80px;
                height: 80px;
            }

            .title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="../../vid/USER1.mp4" type="video/mp4">
    </video>

    <div class="container">
        
        <div class="top-bar">
            <h2 class="title">Edit Friend Profile</h2>
        </div>
        
        <form id="editFriendForm" class="form-card" method="POST" action="../../php/user/friendInfo.php" enctype="multipart/form-data">
            <input type="hidden" id="editFriendId" name="friend_id">
            <input type="hidden" name="action" value="update">

            <div class="form-inner">
                <div class="left-panel">
                    <div class="photo-upload-wrapper">
                        <div class="circle-photo" id="photoContainer">
                            <svg id="avatarPreview" class="avatar-placeholder" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/>
                            </svg>
                        </div>
                        <div class="camera-badge">
                            <img src="https://img.icons8.com/ios-glyphs/90/ffffff/camera.png" style="width: 12px; height: 12px; object-fit: contain;">
                        </div>
                        <input type="file" id="photoInput" name="friend_pic" accept="image/*" class="hidden-file-input" onchange="previewPhoto()">
                    </div>
                    <div>
                        <span class="underline-name" id="shortNameLabel">name</span>
                    </div>
                </div>
                
                <div class="right-panel">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="editName" name="friend_name" placeholder="Name" required autocomplete="off"
                               oninput="document.getElementById('shortNameLabel').innerText = this.value.trim().split(' ')[0] || 'name'">
                    </div>
                    <div class="input-group">
                        <label>Gender</label>
                        <select id="editGender" name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Phone</label>
                        <input type="text" id="editPhone" name="phone" placeholder="no phone" required>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="editEmail" name="email" placeholder="email" required>
                    </div>
                    <div class="input-group">
                        <label>Address Line 1</label>
                        <input type="text" id="inputAddress1" name="address_line1" placeholder="house no./lot no./floor and building name" required>
                    </div>
                    <div class="input-group">
                        <label>Address Line 2</label>
                        <input type="text" id="inputAddress2" name="address_line2" placeholder="number, street name/district" required>
                    </div>
                    <div class="input-group">
                        <label>Postcode</label>
                        <input type="text" id="inputAddress3" name="postcode" placeholder="postcode and locality name" required>
                    </div>
                    <div class="input-group">
                        <label>State</label>
                        <select id="inputState" name="state" required>
                            <option value="" disabled selected hidden>State</option>
                            <option value="SELANGOR">SELANGOR</option>
                            <option value="KUALA LUMPUR">KUALA LUMPUR</option>
                            <option value="NEGERI SEMBILAN">NEGERI SEMBILAN</option>
                            <option value="MELAKA">MELAKA</option>
                            <option value="JOHOR">JOHOR</option>
                            <option value="PERAK">PERAK</option>
                            <option value="PAHANG">PAHANG</option>
                            <option value="KEDAH">KEDAH</option>
                            <option value="KELANTAN">KELANTAN</option>
                            <option value="PERLIS">PERLIS</option>
                            <option value="SABAH">SABAH</option>
                            <option value="SARAWAK">SARAWAK</option>
                            <option value="TERENGGANU">TERENGGANU</option>
                            <option value="PULAU PINANG">PULAU PINANG</option>
                        </select>
                    </div>

                    <div class="actions-row">
                        <button type="button" class="btn btn-cancel" onclick="window.location.href='friendInfo.html'">Cancel</button>
                        <button type="submit" class="btn btn-save">Update</button>
                    </div>
                </div>
            </div>
        </form>

    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const friendId = urlParams.get('id');

            if (!friendId) {
                alert("No friend reference context found to process edits.");
                window.location.href = "friendInfo.html";
                return;
            }

            fetch(`../../php/user/friendInfo.php?id=${friendId}`)
                .then(response => response.json())
                .then(friend => {
                    if (!friend || friend.error) {
                        alert("Error: Friend profile records could not be recovered.");
                        window.location.href = "friendInfo.html";
                        return;
                    }
                    
                    document.getElementById("editFriendId").value = friendId;
                    document.getElementById("editName").value = friend.friend_name || '';
                    document.getElementById("editGender").value = friend.gender || 'Male';
                    document.getElementById("editPhone").value = friend.phone || '';
                    document.getElementById("editEmail").value = friend.email || '';
                    document.getElementById("inputAddress1").value = friend.address_line1 || '';
                    document.getElementById("inputAddress2").value = friend.address_line2 || '';
                    document.getElementById("inputAddress3").value = friend.postcode || '';
                    document.getElementById("inputState").value = friend.state || '';

                    document.getElementById("shortNameLabel").innerText = friend.friend_name ? friend.friend_name.trim().split(' ')[0] : 'name';

                    if (friend.friend_image && friend.friend_image !== 'default_avatar.png') {
                        const previewContainer = document.getElementById('photoContainer');
                        const oldAvatar = document.getElementById('avatarPreview');

                        let img = document.getElementById('uploadedImg');
                        if (!img) {
                            img = document.createElement('img');
                            img.id = 'uploadedImg';
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'cover';
                            img.style.borderRadius = '50%';
                            previewContainer.insertBefore(img, previewContainer.firstChild);
                        }
                        
                        if (oldAvatar) oldAvatar.style.display = 'none';
                        img.src = `../../img/${friend.friend_image}`;
                    }
                })
                .catch(err => {
                    console.error("Error pulling single record row structure details:", err);
                });
        };

        function previewPhoto() {
            const fileInput = document.getElementById('photoInput');
            const previewContainer = document.getElementById('photoContainer');
            const oldAvatar = document.getElementById('avatarPreview');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    let img = document.getElementById('uploadedImg');
                    
                    if (!img) {
                        img = document.createElement('img');
                        img.id = 'uploadedImg';
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        img.style.borderRadius = '50%';
                        previewContainer.insertBefore(img, previewContainer.firstChild);
                    }
                    
                    if (oldAvatar) oldAvatar.style.display = 'none';
                    img.src = e.target.result;
                }
                reader.readAsDataURL(fileInput.files[0]);
            }
        }
    </script>
</body>
</html>
